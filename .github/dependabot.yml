# -----------------------------------------------------------------------------
# Dependabot: weekly pull requests to keep the CI and the base image current.
#
#   - github-actions: the actions used by .github/workflows/*.yml
#   - docker: the base image of the Dockerfile. It is pinned by digest
#     (node:24-alpine@sha256:...), so Dependabot proposes every rebuild of
#     Node 24 Alpine (security fixes of Node and Alpine). Major Node versions
#     are ignored: move to the next LTS by hand (and update the CI to match).
#
# Each pull request runs the CI (lint, tests) and the manifest validation.
# -----------------------------------------------------------------------------
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build
